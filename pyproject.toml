[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instrumentmt"
version = "0.1.0"
description = "Compositional Certificates for Metamorphic Testing of Quantum Compilers with Classical Control"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "sympy>=1.12", "z3-solver>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["instrumentmt*"]
